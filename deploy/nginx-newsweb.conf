# Nginx reverse proxy for the NewsWeb Monitor API.
#
# Replace NEWSWEB_DOMAIN with your real hostname (e.g. newsweb.example.no) everywhere below.
#
# Install:
#   sudo cp deploy/nginx-newsweb.conf /etc/nginx/sites-available/newsweb
#   sudo ln -s /etc/nginx/sites-available/newsweb /etc/nginx/sites-enabled/newsweb
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain TLS (this also rewrites this file to add the 443 server block & redirect):
#   sudo certbot --nginx -d NEWSWEB_DOMAIN
#
# The block below is the pre-TLS (port 80) version. After Certbot runs, it manages 443.

server {
    listen 80;
    listen [::]:80;
    server_name NEWSWEB_DOMAIN;

    # Proxy everything to the Node app on localhost:3000.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Small hardening: don't serve the SQLite file or config even if paths leak.
    location ~* \.(db|db-wal|db-shm|json)$ {
        return 404;
    }
}
